name: Terraform

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false
      destroy:
        description: 'Destruir ambiente?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false
      plan_destroy:
        description: 'Planejar o destroy do ambiente?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  id-token: write
  contents: read

jobs:
  job_1:
    name: Terraform 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with: 
          role-to-assume: arn:aws:iam::087730891281:role/Github-infra-Role
          aws-region: us-east-1
      
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform
        run: terraform init 
      
      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan 
        run: terraform plan -out tfplan.tfout 

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan.tfout
        if: github.event.inputs.apply == 'true'
        
      - name: Plan destroy
        run: terraform plan -destroy -out tfplan.tfout
        if: github.event.inputs.destroy == 'true'
      
      - name: Terraform destroy
        run: terraform apply -destroy -auto-approve tfplan.tfout
        if: github.event.inputs.destroy == 'true'

